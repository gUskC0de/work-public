# Local development overrides — automatically merged by `docker compose up` alongside
# docker-compose.yml (Compose loads docker-compose.override.yml by default when present).
# DO NOT use this file in production: it republishes Postgres to the host and disables the
# read-only root filesystem restrictions to make local debugging/log-tailing easier.
#
# For a production deploy, run explicitly without the override, e.g.:
#   docker compose -f docker-compose.yml up -d --build

services:
  postgres:
    ports:
      - "5432:5432"

  api:
    read_only: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  worker:
    read_only: false
    environment:
      DOTNET_ENVIRONMENT: Development

  frontend:
    read_only: false
